# WOKRING CHANGE BACKEND URI

server {
    # 1. Port 8080 για το Cloud Run
    listen 8080;
    server_name localhost;

    # 2. Vue Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 3. Backend Proxy
    location /api/ {
        # --- Η ΔΙΟΡΘΩΣΗ ΕΙΝΑΙ ΕΔΩ ---
        # Αφαίρεσα το slash (/) από το τέλος.
        # Τώρα το "/api/auth/signup" φτάνει στο Spring ως "/api/auth/signup"
        # και ταιριάζει με τον κανόνα .requestMatchers("/api/auth/**").permitAll()
        proxy_pass https://crowdfunding-api-669481188908.europe-west1.run.app;

        # Ρυθμίσεις για Cloud Run HTTPS
        proxy_ssl_server_name on;
        proxy_set_header Host crowdfunding-api-669481188908.europe-west1.run.app;
        
        # Headers
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}