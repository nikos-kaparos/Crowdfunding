# ------------------------------------------------ #
#                  DB (runtime- config)            #
# ------------------------------------------------ #
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Cloud Run uses PORT env var
server.port=${PORT:8080}


#For error handler
server.error.whitelabel.enabled=false
#For swagger doc
springdoc.api-docs.path=/api-docs


